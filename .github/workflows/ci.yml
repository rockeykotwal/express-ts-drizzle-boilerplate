name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref so stale builds don't queue up.
# This is safe for CI — unlike deploys, a cancelled test run has no side effects.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job: Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job: Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       testdb
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - '1025:1025'

    env:
      NODE_ENV:                   test
      DB_HOST:                    localhost
      DB_PORT:                    5432
      DB_NAME:                    testdb
      DB_USER:                    postgres
      DB_PASS:                    postgres
      DB_POOL_MIN:                1
      DB_POOL_MAX:                5
      REDIS_URL:                  redis://localhost:6379
      JWT_SECRET:                 test-secret-key-minimum-32-characters-long
      EMAIL_PROVIDER:             smtp
      EMAIL_FROM:                 test@example.com
      EMAIL_FROM_NAME:            TestApp
      SMTP_HOST:                  localhost
      SMTP_PORT:                  1025
      SMTP_SECURE:                false
      REQUIRE_EMAIL_VERIFICATION: false
      FRONTEND_URL:               http://localhost:5173
      APP_NAME:                   TestApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job: TypeScript Build ────────────────────────────────────────────────────
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Verify compiled entry point exists
        run: ls dist/app.js
